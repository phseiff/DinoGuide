<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>DinoGuide</title>
  </head>
  <body></body>
</html>
<body>

<h1>DinoGuide</h1>

<p>Find out what dinos to expect when and where when traveling back in time.</p>

<script src="dinos.js"></script>
<script src="places.js"></script>
<script src="structuring.js"></script>

<script>

    // Function to load from cookies:
    function initialize_from_cookies() {
        let name = "dino_guide_app_state=";
        let result = document.cookie.split(name);
        if (result.length >= 2) {
            result = result[1].split(";")[0];
            _data = JSON.parse(result);
        }
        // fill forms from _data:
        document.getElementById("place_use_system_location").checked = _data.use_device_location;
        if (_data.use_device_location) {
            useDeviceLocation();
        }
        document.getElementById("place_name").innerHTML = location_coords_JSON_to_string(_data.location_coordinates) + "<br>";
        document.getElementById("use_system_time").checked = _data.use_device_time;
        if (_data.use_device_time) {
            use_device_time();
        }
        document.getElementById("time_as_text").value = _data.million_years_ago;
        document.getElementById("time_as_range").value = _data.million_years_ago;
        update_time_as_name();
        // Initialize search
        _search_is_ready = true;
        build_places_tree(_places);
    }

    // Function to save to cookies:
    window.addEventListener("beforeunload", function(event){
        document.cookie = "dino_guide_app_state=" + JSON.stringify(_data);
    });

    document.addEventListener('DOMContentLoaded', initialize_from_cookies, false);

    // Default values for everything that we store as cookies:
    var _search_is_ready = false;
    var _data = {
        use_device_location: false,
        location_coordinates: {},
        consent_to_osm_usage: false,
        use_device_time: false,
        million_years_ago: 66,
    }

    const userLang = navigator.language || navigator.userLanguage;
    const userLang_short = userLang.split("-")[0];

    function location_coords_JSON_to_string(location_coords_JSON) {
        if (location_coords_JSON.display_name) {
            if (location_coords_JSON.is_relation) {
                return location_coords_JSON.display_name + "<small> (area)</small>";
            } else {
                return location_coords_JSON.display_name + "<small> (position)</small>";
            }
        } else if (location_coords_JSON.latitude) {
            return (
                "Lat: " + location_coords_JSON.latitude
                + ", Long: " + location_coords_JSON.longitude
            )
        } else {
            return "";
        }
    }

    function lock_location_selection_functionalities(loading_icon_where) {
        document.getElementById("place_use_system_location").disabled = true;
        document.getElementById("place_search_button").disabled = true;
        document.getElementById("search_dinosaurs_button").disabled = true;
        var location_search_results = document.getElementById("location_search_results");
        if (location_search_results) {
            location_search_results.disabled = true;
        }
        // TODO: add little throttle depending on value of loading_icon_where:
        if (loading_icon_where == "place_search_button") {

        } else if (loading_icon_where == "place_use_system_location") {

        } else if (loading_icon_where == "search_dinosaurs_button") {

        } else {
            throw new Error('loading_icon_where has invalid value: ' + loading_icon_where);
        }
    }

    function unlock_location_selection_functionalities() {
        document.getElementById("place_use_system_location").disabled = false;
        document.getElementById("place_search_button").disabled = false;
        document.getElementById("search_dinosaurs_button").disabled = false;
        var location_search_results = document.getElementById("location_search_results");
        if (location_search_results) {
            location_search_results.disabled = false;
        }
        // TODO: remove throttle on all location selectors.
    }

    // Code for using the device location:

    function displayDeviceLocationAccessError(error_text) {
        document.getElementById("device_location_error_text").innerText = error_text;
    }

    function onDeviceLocationSuccess(location) {
        unlock_location_selection_functionalities();
        if (location.coords) {
            _data.location_coordinates = location.coords.toJSON();
        } else {
            _data.location_coordinates = location;
        }
        var location_as_string = location_coords_JSON_to_string(_data.location_coordinates);
        document.getElementById("place_name").innerHTML = location_as_string + "<br>";
        displayDeviceLocationAccessError("");
    }

    function handleDeviceLocationAccessError(error) {
        unlock_location_selection_functionalities();
        checkbox.checked = false;
        var error_text = "";
        if (error.code == error.PERMISSION_DENIED)
            error_text = "Location access denied.";
        else if (error.code == error.POSITION_UNAVAILABLE)
            error_text = "Location information unavailable.";
        else if (error.code == error.TIMEOUT)
            error_text = "Location request timed out.";
        else if (error.code == error.UNKNOWN_ERROR)
            error_text = "Location request unsuccessful.";
        displayDeviceLocationAccessError(error_text);
    }

    function useDeviceLocation() {
        var checkbox = document.getElementById("place_use_system_location");
        if (checkbox.checked && !checkbox.disabled) {
            if (!navigator.geolocation) {
                displayDeviceLocationAccessError("Device location functionality unsupported by device.");
                checkbox.checked = false;
                _data.use_device_location = false;
            } else {
                _data.use_device_location = true;
                lock_location_selection_functionalities("place_use_system_location");
                navigator.geolocation.getCurrentPosition(onDeviceLocationSuccess, handleDeviceLocationAccessError);
            }
        }
    }

    // search non-device location:

    const overpass_search_req = new XMLHttpRequest();

    function onLocationSelectionChoice() {
        var selected_value = document.getElementById("location_search_results").value;
        if (selected_value == "select") {
            return;
        }
        var [index, id] = selected_value.split(" ");
        if (_location_dropdown_selection[index].id != id) {
            // having the id to check against saveguards us against problems
            //  caused by users clicking on an option whilst onLocationSearchSuccess
            //  is running. Which should be impossible, but better safe than sorry.
            return;
        }
        onDeviceLocationSuccess({
            display_name: _location_dropdown_selection[index].display_name,
            is_relation: _location_dropdown_selection[index].is_relation,
            id: id,
        });
        document.getElementById("place_use_system_location").checked = false;
        _data.use_device_location = false;
    }

    function onLocationSearchSuccess(responseText) {
        // parse xml
        const xml_data = new DOMParser().parseFromString(responseText, "text/xml");
        // build selection
        var search_result_elem = document.getElementById("search_result_selection");
        var osm_node = xml_data.querySelector("osm");
        for (var i=osm_node.children.length-1; i>=0; i=i-1) {
            var tag_name = (osm_node.children[i].nodeName || "").toLowerCase();
            if (tag_name != "node" && tag_name != "relation" && tag_name != "way") {
                osm_node.children[i].remove();
            }
        }
        if (osm_node.children.length == 0) {
            displayDeviceLocationAccessError("No locations fitting the search term found.");
            return;
        }
        // build data structure
        var results = [];
        for (var i=0; i<osm_node.children.length; i=i+1) {
            var result = {};
            results.push(result);
            result.display_name = "";
            result.id = osm_node.children[i].getAttribute("id");
            result.debugging_text = osm_node.children[i].outerHTML;
            result.is_relation = osm_node.children[i].nodeName.toLocaleLowerCase() == "relation";
            // find best human-readable name for the search result
            let nametag = osm_node.children[i].querySelector('tag[k="name:' + userLang + '"]');
            if (nametag) { // first, try user language
                result.display_name = nametag.getAttribute("v");
            } else {
                nametag = osm_node.children[i].querySelector('tag[k="name:' + userLang_short + '"]');
                if (nametag) { // then, try generalized form of it (e.g. "en" rather than "en-US")
                    result.display_name = nametag.getAttribute("v");
                } else {
                    nametag = osm_node.children[i].querySelector('tag[k="name"]');
                    if (nametag) { // then, try the general name attribute, which should be the official name of the place in its own language.
                        result.display_name = nametag.getAttribute("v");
                    } else { // then, try english, since that's the language the website is in
                        nametag = osm_node.children[i].querySelector('tag[k="name:en"]');
                        if (nametag) {
                            result.display_name = nametag.getAttribute("v");
                        } else { // then, try whatever language comes first on the list of languages
                            nametag = osm_node.children[i].querySelector('tag[k^="name"]');
                            result.display_name = nametag.getAttribute("v");
                        }
                    }
                }
            }
            var is_street_sign = osm_node.children[i].querySelector('tag[k="traffic_sign"]');
            if (is_street_sign) {
                result.display_name += " (traffic sign)";
            }
            var is_amenity = osm_node.children[i].querySelector('tag[k="amenity"]');
            var is_building;
            if (is_amenity) {
                result.display_name += " (" + is_amenity.getAttribute("v") + ")";
            } else {
                is_building = osm_node.children[i].querySelector('tag[k="building"]');
                if (is_building && is_building.getAttribute("v") === "yes") {
                    result.display_name += " (building)";
                } else if (is_building) {
                    result.display_name += " (" + is_building.getAttribute("v") + ")";
                }
            }
            var is_in_city = osm_node.children[i].querySelector('tag[k="addr:city"]');
            if (is_in_city) {
                result.display_name += " (in " + is_in_city.getAttribute("v") + ")";
            }
            var is_in_tag = osm_node.children[i].querySelector('tag[k="is_in"]');
            if (is_in_tag) {
                result.display_name += " (in " + is_in_tag.getAttribute("v") + ")";
            }
            var postal_code = osm_node.children[i].querySelector('tag[k="postal_code"]');
            if (postal_code) {
                result.display_name += " [" + postal_code.getAttribute("v") + "]";
            }
            // add coordinates if the thing in question is a node rather than a relation
            if (!result.is_relation) {
                result.latitide = osm_node.children[i].getAttribute("lat");
                result.longitude = osm_node.children[i].getAttribute("lon");
                if ((is_amenity || is_street_sign || is_building) && !is_in_city && !is_in_tag) {
                    result.display_name += " (" + location_coords_JSON_to_string({
                        latitude: result.latitide,
                        longitude: result.longitude,
                    }) + ")";
                }
            }
            result.display_name = result.display_name.replace("_", " ");
        }
        // order data structure to put relations first
        results.sort(function(a, b) {
            return a.display_name.length - b.display_name.length;
        });
        var j = 0;
        for (var i=0; i<results.length; i++) {
            if (results[j].is_relation) {
                j += 1;
            } else {
                results.push(results.splice(j, 1)[0]);
            }
        }
        // build html
        var inner_html = '<select id="location_search_results"  onchange="onLocationSelectionChoice()">';
        inner_html += "<option value='select'>Select search result...</option>";
        for (var i=0; i<osm_node.children.length; i=i+1) {
            // The out-commented code is what i wrote to divide the dropdown into area and position results,
            // but it didn't work because of the way that html dropdowns work, and I do not have the time to
            // re-implement them (and frankly, doing so would probably hurt accessibility).
            /*var introduction = "";
            if (i==0 && results[i].is_relation) {
                introduction = "<b>Areas:</b><br>"
            } else if ((i>0 && results[i-1].is_relation && !results[i].is_relation) || (i==0 && !results[i].is_relation)) {
                introduction = "<b>Individual Positions:</b><br>"
            }*/
            inner_html += "<option value='" + i + " " + results[i].id + "''>"/* + introduction*/ + results[i].display_name + "</option>";
        }
        inner_html += '</select><br>';
        search_result_elem.innerHTML = inner_html;
        _location_dropdown_selection = results;
        console.log(_location_dropdown_selection);
    }

    function onLocationSearchFinished(req) {
        if (overpass_search_req.readyState == 4 && overpass_search_req.status == 200) {
            onLocationSearchSuccess(overpass_search_req.responseText);
        } else {
            displayDeviceLocationAccessError("Location search failed :(");
        }
        unlock_location_selection_functionalities("place_search_button");
    }

    function userConsentsToThirdPartyServices() {
        if (!_data.consent_to_osm_usage) {
            _data.consent_to_osm_usage = confirm(
"This and other functionalities of this site pass data to third-party location services\
 like overpass-api.de and openstreetmap.org.\nIs that okay with you?"
            )
        }
        return _data.consent_to_osm_usage;
    }

    function searchLocation() {
        if (document.getElementById("place_search_button").disabled) {
            return;
        }
        // check if user is okay with userdata being passed to Drittanbieter
        if (!userConsentsToThirdPartyServices()) {
            return;
        }
        // reject if the search field is empty
        var search_term = document.getElementById("place").value;
        if (search_term.length == 0) {
            displayDeviceLocationAccessError("No valid search term entered.");
            return;
        }
        // if search term is too short, search only for areas with specific name rather than all areas starting with it
        var relation_search;
        if (search_term.length <= 3) {
            relation_search = 'relation[~"^name"~"^' + search_term + '$"]';
        } else {
            relation_search = 'relation[~"^name"~"' + search_term + '"]';
        }
        // construct query
        var body = (
            '(' + relation_search + ';node[~"^name"~"^' + search_term + '$"][!"fixme"][!"historic"];' +
            ');out meta;'
        );
        // send search request
        overpass_search_req.open("POST", "https://overpass-api.de/api/interpreter");
        overpass_search_req.setRequestHeader("Content-Type", "application/json; charset=UTF-8");
        overpass_search_req.onload = onLocationSearchFinished;
        overpass_search_req.send(body);
        lock_location_selection_functionalities("place_search_button");
    }

    function locationSearchCheckEnter(event) {
        if (event.key == "Enter") {
            searchLocation()
        }
    }

    // Time inputs

    function update_time_as_name() {
        var time_as_name_field = document.getElementById("time_as_name");
        let time = _data.million_years_ago;
        var time_as_name;
        if (time >= 66 && time <= 100) {
            time_as_name = "Late Cretaceous";
        } else if (time >= 101 && time <= 145) {
            time_as_name = "Early Cretaceous";
        } else if (time >= 146 && time <= 161) {
            time_as_name = "Late Jurassic";
        } else if (time >= 162 && time <= 174) {
            time_as_name = "Middle Jurassic";
        } else if (time >= 175 && time <= 201) {
            time_as_name = "Early Jurassic";
        } else if (time >= 202 && time <= 237) {
            time_as_name = "Late Triassic";
        } else if (time >= 238 && time <= 247) {
            time_as_name = "Middle Triassic";
        } else if (time >= 248 && time <= 252) {
            time_as_name = "Early Triassic";
        }
        time_as_name_field.innerHTML = time_as_name + "<br>";
    }

    function on_time_change(cause) {
        var time = document.getElementById(cause).value;
        if (cause == "time_as_text") {
            document.getElementById("time_as_range").value = time;
        } else if (cause == "time_as_range") {
            document.getElementById("time_as_text").value = time;
        }
        _data.million_years_ago = time;
        document.getElementById("use_system_time").checked = false;
        _data.use_device_time = false;
        update_time_as_name();
    }

    function use_device_time() {
        var checkbox = document.getElementById("use_system_time");
        if (!checkbox.checked) {
            return;
        }
        var date = new Date();
        var year = date.getFullYear();
        year = year / (10**6);
        if (year <= -66 && year >= -252) {
            year = Math.round(year);
            document.getElementById("time_as_text").value = -year;
            document.getElementById("time_as_range").value = -year;
            _data.million_years_ago = -year;
            _data.use_device_time = true;
            update_time_as_name()
        } else {
            document.getElementById("device_time_error_text").innerHTML = "System time is not within valid range.";
            checkbox.checked = false;
        }
    }

    // Dino Search
    var _times_that_search_has_run = 0;

    function search_dinosaurs() {
        // check if user is okay with userdata being passed to Drittanbieter.
        // (We do this check before giving them information like "no valid location entered" because
        // we don't want a user to get the impression that we were somehow about to start the process
        // without asking beforehand. )
        if (!userConsentsToThirdPartyServices()) {
            return;
        }
        // Check if location was entered:
        if (_data.location_coordinates.latitude == undefined && _data.location_coordinates.display_name == undefined) {
            document.getElementById("dino_search_error_text").innerHTML = "No valid location entered.<br>"
            return;
        }
        document.getElementById("dino_search_error_text").innerHTML = "";
        // remove outdated dino information:
        if (_times_that_search_has_run > 0) {
            clear_dinos_from_place_tree(_places);
        }
        _times_that_search_has_run += 1;
        // add dinos to places tree:
        add_dinos_to_places_tree(_places, _dinos, _data.million_years_ago, _data.million_years_ago);
        // lock interfaces:
        lock_location_selection_functionalities("search_dinosaurs_button");
        // do the actual search:
        start_searching_dinosaurs_in_places_tree(_places, _data.location_coordinates);
    }

    function finish_search_dinosaurs(success) {
        if (success) {
            // TODO: build result interfaces
        } else {
            document.getElementById("dino_search_error_text").innerHTML = "Dino search failed to complete due to API requests failing. This may be due to overloaded servers or due to internet connection problems.<br>"
        }
        // unlock interfaces:
        unlock_location_selection_functionalities();
    }


</script>

<form id="search_form">
    <label id="error_text"></label>

    <label for="place">Where to travel:</label><br>
    <label id="place_name"></label>
    <input type="text" id="place" name="place" onkeypress="locationSearchCheckEnter(event)">
    <button id="place_search_button" name="place_search_button" type="button" onClick="searchLocation()">Search</button><br>
    <span id="search_result_selection"></span>
    <input type="checkbox" id="place_use_system_location" name="place_use_system_location" onclick="useDeviceLocation()">
    <label for="place_use_system_location">Use device location</label><br>
    <label id="device_location_error_text"></label>

    <br>

    <label for="time">What time to travel to:</label><br>
    <input type="number" id="time_as_text" name="time_as_text" min="66" max="252" value="66" oninput="on_time_change('time_as_text');">
    <label for="time_as_text">million years ago</label><br>
    <input type="range" id="time_as_range" name="time_as_range" min="66" max="252" value="66" onchange="on_time_change('time_as_range');"><br>
    <label id="time_as_name"></label>
    <span hidden="true">
    <input type="checkbox" id="use_system_time" name="use_system_time" onclick="use_device_time('')">
    <label for="use_system_time">Use system time</label><br>
    <label id="device_time_error_text"></label><br>
    </span>

    <br>

    <button id="search_dinosaurs_button" type="button" onclick="search_dinosaurs();">Show Dinosaurs!</button><br>
    <label id="dino_search_error_text"></label>
</form>

</body>
